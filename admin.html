<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>奖品管理 · CUHK-Shenzhen</title>
  <style>
    /* ========== 设计变量（与 2025 仓库保持一致） ========== */
    :root{
      --border: #000;
      --border2: #000;
      --panel: #ffffff;
      --bg-top: #FFF4CC;
      --bg-bottom: #BFA8FF;
      --purple: #A78BFA;
    }
    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0; min-height:100svh;
      background:url("图层 1.png") no-repeat center/cover;
      background-image: url("图层 1.png"), linear-gradient(180deg,#FFF4CC 0%,#e7d8f3 50%,#BFA8FF 100%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow-x:hidden; overflow-y:auto;
    }

    /* ========== 响应式舞台 ========== */
    .stage{ position:relative; width:min(400px, calc(100vw - 24px)); }
    .wrap{ position:relative; width:100%; }

    /* ========== 证件卡外观 ========== */
    .badge{
      position:relative; z-index:1; width:100%; border-radius:32px;
      background: linear-gradient(
        to bottom,
        #f2e6b9 0%,
        #e7d8f3 45%,
        #c7b5ff 100%
      );
      display:flex; flex-direction:column;
    }
    .badge::before{ /* 外层粗黑边 */
      content:""; position:absolute; inset:0; border-radius:32px;
      box-shadow:0 0 0 8px var(--border2) inset; pointer-events:none; z-index:3;
    }
    .badge::after{ /* 内层细黑边 */
      content:""; position:absolute; inset:14px; border-radius:24px;
      box-shadow:0 0 0 4px var(--border) inset; pointer-events:none; z-index:3;
    }
    .content{ position:relative; z-index:1; display:flex; flex-direction:column; }

    /* G2 连续曲率 */
    .badge, .badge::before, .badge::after,
    .panel, .btn, .toast,
    .prize-item, .admin-form .field, .prize-item-delete,
    .admin-add-btn{
      corner-shape:squircle;
    }

    /* ========== 页面布局 ========== */
    .page{
      width:100%; min-height:100svh;
      padding:16px max(12px, env(safe-area-inset-right)) 16px max(12px, env(safe-area-inset-left));
      display:flex; flex-direction:column; align-items:center; justify-content:center;
    }
    .page .stage{ animation:stageEnter .46s cubic-bezier(.2,.8,.2,1) both; }

    /* ========== 标题 ========== */
    .title{
      text-align:center; font-size:30px; font-weight:800; letter-spacing:1px;
      margin:32px 0 0; position:relative; z-index:2;
    }
    .subtitle{
      text-align:center; font-size:13px; color:#555; margin-bottom:4px;
      position:relative; z-index:2;
    }

    /* ========== 通用面板 ========== */
    .panel{
      margin:18px 28px 0; background:var(--panel); border-radius:24px;
      box-shadow: inset 0 0 0 4px var(--border);
      padding:18px 18px 20px; position:relative; z-index:2;
      min-height:340px; display:flex; flex-direction:column; overflow:hidden;
    }

    /* ========== 按钮 ========== */
    .btn-row{
      margin:18px 28px 24px; position:relative; z-index:2;
      display:flex; gap:12px;
    }
    .btn-row .btn{ flex:1; }
    .btn{
      width:100%; height:44px; border-radius:999px; border:4px solid #000;
      background:#111; color:#fff; font-size:18px; font-weight:800;
      letter-spacing:2px; cursor:pointer; font-family:inherit;
      white-space:nowrap; min-width:0; padding:0 14px;
    }
    .btn:active{ transform:translateY(1px); }
    .btn:disabled{ opacity:.35; cursor:not-allowed; }
    .btn-outline{
      background:#fff; color:#111;
      border:3px solid #000;
    }

    @media (hover:hover){
      .btn{ transition:transform .18s ease, box-shadow .18s ease, opacity .18s ease; }
      .btn:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 5px 0 rgba(0,0,0,.16); }
    }

    @media (prefers-reduced-motion:reduce){
      *, *::before, *::after{
        animation-duration:.01ms !important;
        animation-delay:0ms !important;
        transition-duration:.01ms !important;
        scroll-behavior:auto !important;
      }
    }

    /* ========== 管理表单 ========== */
    .admin-form{
      display:flex; flex-direction:column; gap:12px; margin-bottom:14px;
      padding-bottom:14px; border-bottom:2px dashed #ddd;
    }
    .admin-form .row{ display:flex; gap:8px; align-items:center; }
    .admin-form .field{
      flex:1; height:38px; background:#fff; border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,.06); padding:0 12px;
      display:flex; align-items:center; position:relative;
    }
    .admin-form .field::after{ display:none; }
    .admin-form .input{
      width:100%; border:none; outline:none; background:transparent;
      font-size:15px; font-weight:600; font-family:inherit;
    }
    .admin-form .field-small{ flex:0 0 70px; }
    .admin-add-btn{
      flex:0 0 auto; height:38px; padding:0 16px; font-size:14px;
      border-radius:999px; border:3px solid #000; background:#fff; color:#111;
      font-weight:800; cursor:pointer; font-family:inherit; letter-spacing:1px;
    }
    .admin-add-btn:active{ transform:translateY(1px); }

    /* ========== 奖品列表 ========== */
    .prize-list{
      flex:1; min-height:0; overflow-y:auto;
      display:flex; flex-direction:column; gap:8px;
      -webkit-overflow-scrolling:touch;
    }
    .prize-item{
      display:flex; align-items:center; gap:10px; padding:10px 12px;
      border:2px solid #eee; border-radius:14px; background:#fafafa;
      transition:all .15s ease;
    }
    .prize-item:hover{ border-color:#999; }
    .prize-item-icon{ font-size:24px; flex:0 0 auto; }
    .prize-item-name{
      flex:1; font-size:14px; font-weight:700; color:#333;
      min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .prize-item-count{ display:flex; align-items:center; gap:6px; font-size:13px; color:#555; }
    .prize-item-count input{
      width:50px; height:30px; border:2px solid #ccc; border-radius:8px;
      text-align:center; font-size:14px; font-weight:700; font-family:inherit; outline:none;
    }
    .prize-item-count input:focus{ border-color:#111; }
    .prize-item-delete{
      flex:0 0 auto; width:30px; height:30px; border:2px solid #ccc; border-radius:50%;
      background:#fff; color:#999; font-size:16px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; transition:all .15s ease;
    }
    .prize-item-delete:hover{ border-color:#FF3366; color:#FF3366; }

    .prize-empty{ text-align:center; padding:24px; color:#999; font-size:14px; }

    /* ========== 同步状态指示 ========== */
    .sync-status{ font-size:11px; font-weight:700; text-align:center; margin-bottom:4px; }
    .sync-status.online{ color:#10B981; }
    .sync-status.offline{ color:#999; }

    /* ========== Toast ========== */
    .toast{
      position:fixed; top:20px; left:50%;
      transform:translateX(-50%) translateY(-120px);
      background:#111; color:#fff; padding:10px 22px; border-radius:999px;
      border:3px solid #000; font-size:14px; font-weight:700;
      z-index:999; opacity:0;
      transition:all .35s cubic-bezier(.16,1,.3,1);
      pointer-events:none; white-space:nowrap;
    }
    .toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }

    /* ========== 动画 ========== */
    @keyframes stageEnter{
      from{ opacity:0; transform:translateY(12px) scale(.985); }
      to{ opacity:1; transform:translateY(0) scale(1); }
    }

    /* ========== 响应式 ========== */
    @media (max-width:420px){
      .title{ font-size:clamp(23px, 7.2vw, 28px); }
      .panel{ padding:14px 14px 16px; }
    }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>

  <!-- ==================== 奖品管理后台 ==================== -->
  <div class="page" id="adminPage">
    <div class="stage"><div class="wrap">
      <div class="badge" id="adminCard">
        <div class="content">
          <div class="title">⚙️ 奖品管理</div>
          <div class="subtitle">工作人员后台 · 随时调整奖品类别和数量</div>
          <div class="sync-status" id="syncStatusAdmin">● 连接中...</div>
          <div class="panel">
            <div class="admin-form">
              <div class="row">
                <div class="field" style="flex:0 0 50px;">
                  <input class="input" type="text" id="newPrizeIcon" placeholder="🎁" maxlength="4" style="text-align:center;" />
                </div>
                <div class="field">
                  <input class="input" type="text" id="newPrizeName" placeholder="奖品名称" maxlength="20" />
                </div>
                <div class="field field-small">
                  <input class="input" type="number" id="newPrizeCount" placeholder="数量" min="0" max="999" style="text-align:center;" />
                </div>
                <button class="admin-add-btn" onclick="addPrize()">添加</button>
              </div>
            </div>
            <div class="prize-list" id="prizeList"></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-outline" onclick="goToLottery()">← 返回抽奖</button>
            <button class="btn" onclick="resetPrizes()">恢复默认</button>
          </div>
        </div>
      </div>
    </div></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    /* ========== Toast ========== */
    var toastTimer = null;
    var $toast = document.getElementById('toast');
    function showToast(msg){
      if(toastTimer) clearTimeout(toastTimer);
      $toast.textContent = msg;
      $toast.classList.add('show');
      toastTimer = setTimeout(function(){ $toast.classList.remove('show'); }, 2000);
    }

    /* ========== Firebase 实时同步 ==========
       使用步骤：
       1. 访问 https://console.firebase.google.com/ 创建项目
       2. 左侧选 "Build → Realtime Database" → 创建数据库 → 选"测试模式"
       3. 项目设置 → 常规 → "应用"部分 → 添加 Web 应用 → 复制配置
       4. 把下方占位符替换为你自己的配置值
    */
    var FIREBASE_CONFIG = {
      apiKey: "AIzaSyAgbwA5N30mPBpSoWy4HcwemmQ2GOkCUug",
      authDomain: "cuhsz-lottery.firebaseapp.com",
      databaseURL: "https://cuhsz-lottery-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "cuhsz-lottery",
      storageBucket: "cuhsz-lottery.firebasestorage.app",
      messagingSenderId: "885939478368",
      appId: "1:885939478368:web:1321f120cb7af42904c805"
    };
    var PRIZE_REF = 'cuhsz_lottery/prizes';
    var PRIZE_STORAGE_KEY = 'cuhsz_lottery_prizes_v1';
    var fbDatabase = null;
    var fbReady = false;
    var prizesCache = null;

    /* ========== 奖品数据函数 ========== */
    function getDefaultPrizes(){
      return [
        { id:1, icon:'🏆', name:'一等奖', count:1 },
        { id:2, icon:'🥈', name:'二等奖', count:3 },
        { id:3, icon:'🥉', name:'三等奖', count:5 },
        { id:4, icon:'🎁', name:'参与奖', count:10 }
      ];
    }

    function loadPrizesLocal(){
      try{
        var raw = localStorage.getItem(PRIZE_STORAGE_KEY);
        if(raw){
          var parsed = JSON.parse(raw);
          if(Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
      }catch(e){}
      return getDefaultPrizes();
    }

    function loadPrizes(){
      if(fbReady && prizesCache) return prizesCache;
      return loadPrizesLocal();
    }

    function savePrizes(prizes){
      if(fbReady){
        fbDatabase.ref(PRIZE_REF).set(prizes);
      } else {
        try{ localStorage.setItem(PRIZE_STORAGE_KEY, JSON.stringify(prizes)); }catch(e){}
      }
    }

    function initFirebase(){
      if(FIREBASE_CONFIG.apiKey === 'YOUR_API_KEY'){
        console.log('Firebase 配置未填写，使用本地模式');
        prizesCache = loadPrizesLocal();
        updateSyncStatus(false);
        renderPrizeList();
        return;
      }
      try{
        if(typeof firebase === 'undefined') throw new Error('Firebase SDK 未加载');
        firebase.initializeApp(FIREBASE_CONFIG);
        fbDatabase = firebase.database();
        fbReady = true;
        /* 实时监听 — 任何客户端的改动都会即时推送到所有人 */
        fbDatabase.ref(PRIZE_REF).on('value', function(snapshot){
          var data = snapshot.val();
          if(data && Array.isArray(data) && data.length > 0){
            prizesCache = data;
          } else if(data === null){
            var def = getDefaultPrizes();
            fbDatabase.ref(PRIZE_REF).set(def);
            prizesCache = def;
          } else {
            prizesCache = getDefaultPrizes();
          }
          updateSyncStatus(true);
          onPrizesChanged();
        }, function(err){
          console.error('Firebase 监听失败:', err);
          updateSyncStatus(false);
          if(!prizesCache) prizesCache = loadPrizesLocal();
          renderPrizeList();
        });
      }catch(e){
        console.error('Firebase 初始化失败，回退到 localStorage:', e);
        fbReady = false;
        prizesCache = loadPrizesLocal();
        updateSyncStatus(false);
        renderPrizeList();
      }
    }

    /* 数据变化时自动刷新 UI */
    function onPrizesChanged(){
      renderPrizeList();
    }

    function updateSyncStatus(online){
      var els = document.querySelectorAll('.sync-status');
      for(var i=0; i<els.length; i++){
        els[i].textContent = online ? '● 实时同步' : '● 本地模式';
        els[i].className = 'sync-status ' + (online ? 'online' : 'offline');
      }
    }

    /* ========== 管理 UI 函数 ========== */
    function renderPrizeList(){
      var prizes = loadPrizes();
      var list = document.getElementById('prizeList');
      if(!list) return;
      if(prizes.length === 0){
        list.innerHTML = '<div class="prize-empty">暂无奖品，请在上方添加</div>';
        return;
      }
      var html = '';
      prizes.forEach(function(p){
        html += '<div class="prize-item" data-id="' + p.id + '">'
          + '<span class="prize-item-icon">' + p.icon + '</span>'
          + '<span class="prize-item-name">' + p.name + '</span>'
          + '<div class="prize-item-count">数量 '
          + '<input type="number" value="' + p.count + '" min="0" max="999" '
          + 'onchange="updatePrizeCount(' + p.id + ', this.value)" /></div>'
          + '<button class="prize-item-delete" onclick="deletePrize(' + p.id + ')" aria-label="删除">×</button>'
          + '</div>';
      });
      list.innerHTML = html;
    }

    function addPrize(){
      var iconEl = document.getElementById('newPrizeIcon');
      var nameEl = document.getElementById('newPrizeName');
      var countEl = document.getElementById('newPrizeCount');
      var icon = iconEl.value.trim() || '🎁';
      var name = nameEl.value.trim();
      var count = parseInt(countEl.value, 10);
      if(!name){ showToast('请输入奖品名称'); return; }
      if(isNaN(count) || count < 0){ showToast('请输入有效数量'); return; }

      var prizes = loadPrizes();
      var maxId = prizes.reduce(function(max, p){ return Math.max(max, p.id); }, 0);
      prizes.push({ id:maxId+1, icon:icon, name:name, count:count });
      savePrizes(prizes);

      iconEl.value = '';
      nameEl.value = '';
      countEl.value = '';
      renderPrizeList();
      showToast('已添加：' + name);
    }

    function updatePrizeCount(id, value){
      var count = Math.max(0, Math.min(999, parseInt(value, 10) || 0));
      var prizes = loadPrizes();
      for(var i=0; i<prizes.length; i++){
        if(prizes[i].id === id){ prizes[i].count = count; break; }
      }
      savePrizes(prizes);
    }

    function deletePrize(id){
      var prizes = loadPrizes().filter(function(p){ return p.id !== id; });
      savePrizes(prizes);
      renderPrizeList();
      showToast('已删除');
    }

    function resetPrizes(){
      savePrizes(getDefaultPrizes());
      renderPrizeList();
      showToast('已恢复默认奖品');
    }

    /* ========== 跳转 ========== */
    function goToLottery(){
      window.location.href = 'lottery.html';
    }

    /* ========== 初始化 ========== */
    initFirebase();
  </script>
</body>
</html>
